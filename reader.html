<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bulak">
<meta name="theme-color" content="#F8F4EC">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23241D15'/%3E%3Ctext x='90' y='125' text-anchor='middle' font-family='serif' font-size='120' font-weight='700' fill='%23B58A3C'%3EB%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Bulak%22%2C%22short_name%22%3A%22Bulak%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F8F4EC%22%2C%22theme_color%22%3A%22%23F8F4EC%22%7D">
<title>Bulak — Goşgular hazynasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#F8F4EC; --card:#FFFDF8; --ink:#241D15; --ink-soft:#8A7C62; --gold:#B58A3C; --gold-soft:#E8D3A2; --gold-line:#ECE2CE; --line:#E7DDC9; --heart:#E11D48; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
.serif{font-family:'Playfair Display',serif;}

/* Nav */
.nav{background:var(--card);border-bottom:1px solid var(--gold-line);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
.nav h1{font-size:22px;font-weight:700;letter-spacing:.3px;}
.nav .back{background:none;border:none;color:var(--gold);font-weight:600;font-size:15px;display:flex;align-items:center;gap:4px;padding:0;}
.nav .search-ico{background:none;border:none;color:var(--ink-soft);font-size:20px;padding:4px;}

/* Search */
.search-wrap{display:none;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--gold-line);position:sticky;top:53px;z-index:19;}
.search-wrap.open{display:block;}
.search-in{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;font-family:'Poppins';background:var(--bg);color:var(--ink);}
.search-in:focus{outline:none;border-color:var(--gold);}

/* Screen transitions */
.screen{display:none;animation:fadeIn .2s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Poets list */
.poets-wrap{padding:12px 16px;max-width:600px;margin:0 auto;}
.era-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);margin:20px 0 10px 4px;}
.poet-card{display:flex;align-items:center;gap:13px;padding:12px 14px;background:var(--card);border:1px solid var(--gold-line);border-radius:15px;margin-bottom:8px;cursor:pointer;transition:all .15s;}
.poet-card:active{transform:scale(.98);border-color:var(--gold-soft);}
.poet-av{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:700;color:#6E521C;font-size:22px;overflow:hidden;}
.poet-av img{width:100%;height:100%;object-fit:cover;}
.poet-info{flex:1;min-width:0;}
.poet-info .name{font-family:'Playfair Display';font-size:17px;font-weight:600;margin-bottom:2px;}
.poet-info .years{font-size:12px;color:var(--gold);font-weight:500;}
.poet-info .count{font-size:11.5px;color:var(--ink-soft);}

/* Poet detail */
.poet-hero-r{text-align:center;padding:28px 20px 20px;max-width:600px;margin:0 auto;}
.hero-av{width:90px;height:90px;border-radius:50%;margin:0 auto 14px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display';font-weight:700;color:#6E521C;font-size:38px;overflow:hidden;}
.hero-av img{width:100%;height:100%;object-fit:cover;}
.poet-hero-r h2{font-size:26px;font-weight:700;margin-bottom:4px;}
.poet-hero-r .yrs{color:var(--gold);font-size:14px;font-weight:600;margin-bottom:10px;}
.poet-hero-r .bio-text{color:var(--ink-soft);font-size:13px;line-height:1.65;text-align:left;max-height:4.5em;overflow:hidden;transition:max-height .3s;}
.poet-hero-r .bio-text.expanded{max-height:1000px;}
.bio-toggle{background:none;border:none;color:var(--gold);font-size:12.5px;font-weight:600;margin-top:4px;}

.poems-list{padding:6px 16px 30px;max-width:600px;margin:0 auto;}
.poems-list h3{font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:12px;}
.poem-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--gold-line);border-radius:14px;margin-bottom:7px;cursor:pointer;transition:all .15s;}
.poem-row:active{transform:scale(.98);}
.poem-row .num{font-family:'Playfair Display';font-size:16px;font-weight:700;color:var(--gold-soft);width:28px;text-align:center;flex-shrink:0;}
.poem-row .ptitle{font-family:'Playfair Display';font-size:16px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.poem-row .heart-sm{color:var(--heart);font-size:14px;flex-shrink:0;opacity:.3;}
.poem-row .heart-sm.liked{opacity:1;}

/* Poem reader */
.reader-wrap{padding:24px 20px 60px;max-width:600px;margin:0 auto;}
.reader-wrap .rtitle{font-family:'Playfair Display';font-size:26px;font-weight:700;text-align:center;margin-bottom:6px;line-height:1.2;}
.reader-wrap .rauthor{text-align:center;color:var(--gold);font-size:13.5px;font-weight:600;margin-bottom:20px;}
.reader-wrap .repigraph{text-align:center;color:var(--ink-soft);font-style:italic;font-size:13.5px;margin-bottom:18px;font-family:'Playfair Display';}
.reader-wrap .rtext{font-family:'Playfair Display';font-size:18px;line-height:1.75;white-space:pre-line;text-align:center;}
.reader-wrap .rtext .bold{font-weight:700;}
.reader-wrap .rtext .italic{font-style:italic;}
.reader-wrap .rtext .quote{color:var(--ink-soft);padding-left:16px;border-left:3px solid var(--gold-soft);text-align:left;display:block;margin:8px 0;}
.reader-wrap .rtext .stanza-break{display:block;height:18px;}

/* Like bar */
.like-bar{display:flex;justify-content:center;gap:24px;margin-top:28px;padding-top:20px;border-top:1px solid var(--gold-line);}
.like-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-soft);font-size:12px;font-weight:500;}
.like-btn .icon{font-size:28px;transition:all .2s;}
.like-btn.liked .icon{color:var(--heart);transform:scale(1.15);}
.like-btn:active .icon{transform:scale(1.3);}

/* Favorites tab */
.tabs-bar{display:flex;background:var(--card);border-bottom:1px solid var(--gold-line);position:sticky;top:53px;z-index:19;}
.tab-btn{flex:1;padding:12px;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-bottom:2.5px solid transparent;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}

.empty{text-align:center;color:var(--ink-soft);padding:60px 24px;font-size:14px;}
.loader{text-align:center;padding:50px;color:var(--ink-soft);}
.spin{display:inline-block;width:22px;height:22px;border:2.5px solid var(--gold-line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.credit{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:20px;letter-spacing:.3px;}
.credit b{color:var(--gold);font-weight:600;}
</style>
</head>
<body>

<div class="nav" id="navBar">
  <h1 class="serif" id="navTitle">Bulak</h1>
  <button class="search-ico" id="searchBtn" onclick="toggleSearch()">🔍</button>
</div>
<div class="search-wrap" id="searchWrap">
  <input class="search-in" id="searchIn" placeholder="Şahyr ýa-da goşgy gözle..." oninput="onSearch()">
</div>

<!-- POETS SCREEN -->
<div class="screen active" id="screenPoets">
  <div class="poets-wrap" id="poetsList"></div>
  <div class="credit">by <b>mb.creativee</b></div>
</div>

<!-- POET DETAIL -->
<div class="screen" id="screenPoet">
  <div id="poetDetail"></div>
</div>

<!-- POEM READER -->
<div class="screen" id="screenPoem">
  <div id="poemReader"></div>
</div>

<script>
const API='https://functions.yandexcloud.net/d4eo3o1jdsg8ed74gccl';
let poets=[],curPoetId=null,curPoems=[],curPoemIdx=0;
const imgCache={};

// --- Likes (localStorage) ---
function getLikes(){try{return JSON.parse(localStorage.getItem('bulak_likes')||'{}');}catch(e){return {};}}
function setLike(poemId,v){const l=getLikes();if(v)l[poemId]=1;else delete l[poemId];localStorage.setItem('bulak_likes',JSON.stringify(l));}
function isLiked(poemId){return !!getLikes()[poemId];}

// --- API ---
async function pubApi(q){const r=await fetch(API+q);const d=await r.json();if(!r.ok)throw new Error(d.error||'Näsazlyk');return d;}

// --- Helpers ---
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function initial(n){return(n||'?').trim().charAt(0).toUpperCase();}

// --- Images ---
async function loadImg(imagePath,elId){
  if(!imagePath)return;
  if(imgCache[imagePath]&&imgCache[imagePath]!=='pending'&&imgCache[imagePath]!=='fail'){setI(elId,imgCache[imagePath]);return;}
  if(imgCache[imagePath]==='pending')return;
  imgCache[imagePath]='pending';
  try{const r=await pubApi('?action=publicImage&imagePath='+encodeURIComponent(imagePath));const u=r.dataUrl||r.url;if(u){imgCache[imagePath]=u;setI(elId,u);}else imgCache[imagePath]='fail';}
  catch(e){imgCache[imagePath]='fail';}
}
function setI(id,url){const el=document.getElementById(id);if(el&&url)el.innerHTML='<img src="'+url+'" style="width:100%;height:100%;object-fit:cover;">';}

// --- Navigation ---
function showScreen(name){
  ['screenPoets','screenPoet','screenPoem'].forEach(s=>document.getElementById(s).classList.toggle('active',s==='screen'+name));
  const nav=document.getElementById('navBar');
  const sb=document.getElementById('searchBtn');
  if(name==='Poets'){
    nav.innerHTML='<h1 class="serif">Bulak</h1><button class="search-ico" onclick="toggleSearch()">🔍</button>';
    document.getElementById('searchWrap').classList.remove('open');
  } else if(name==='Poet'){
    const p=poets.find(x=>x.id===curPoetId);
    nav.innerHTML='<button class="back" onclick="showScreen(\'Poets\')">‹ Şahyrlar</button><button class="search-ico" onclick="toggleSearch()">🔍</button>';
    document.getElementById('searchWrap').classList.remove('open');
  } else if(name==='Poem'){
    const p=poets.find(x=>x.id===curPoetId);
    nav.innerHTML='<button class="back" onclick="showScreen(\'Poet\')">‹ '+(p?esc(p.fullName):'')+'</button><span></span>';
    document.getElementById('searchWrap').classList.remove('open');
  }
  window.scrollTo(0,0);
}

function toggleSearch(){document.getElementById('searchWrap').classList.toggle('open');document.getElementById('searchIn').focus();}
function onSearch(){renderPoets();}

// --- POETS LIST ---
async function init(){
  document.getElementById('poetsList').innerHTML='<div class="loader"><div class="spin"></div></div>';
  try{poets=await pubApi('?action=publicPoets');renderPoets();}
  catch(e){document.getElementById('poetsList').innerHTML='<div class="empty">Ýüklenip bilmedi: '+esc(e.message)+'</div>';}
}

function renderPoets(){
  const q=(document.getElementById('searchIn').value||'').trim().toLowerCase();
  const filt=poets.filter(p=>p.fullName.toLowerCase().includes(q));
  const eras={};filt.forEach(p=>{const e=p.category||'Başga';(eras[e]=eras[e]||[]).push(p);});
  const names={'XVIII_XIX':'XVIII–XIX asyr','XX_XXI':'XX–XXI asyr'};
  let html='';
  Object.keys(eras).sort().forEach(era=>{
    html+='<div class="era-label">'+(names[era]||era)+'</div>';
    eras[era].sort((a,b)=>a.sortOrder-b.sortOrder).forEach(p=>{
      html+='<div class="poet-card" onclick="openPoet(\''+p.id+'\')">'+
        '<div class="poet-av" id="rav-'+p.id+'"><span>'+initial(p.fullName)+'</span></div>'+
        '<div class="poet-info"><div class="name">'+esc(p.fullName)+'</div>'+
        '<div class="years">'+esc(p.lifeYears||'')+'</div>'+
        '<div class="count">'+p.poemCount+' goşgy</div></div></div>';
    });
  });
  if(!html) html='<div class="empty">Tapylmady</div>';
  document.getElementById('poetsList').innerHTML=html;
  filt.forEach(p=>{if(p.imagePath)loadImg(p.imagePath,'rav-'+p.id);});
}

// --- POET DETAIL ---
async function openPoet(id){
  curPoetId=id; showScreen('Poet');
  const poet=poets.find(p=>p.id===id);
  const det=document.getElementById('poetDetail');
  det.innerHTML='<div class="loader"><div class="spin"></div></div>';
  try{
    curPoems=await pubApi('?action=publicPoems&poetId='+encodeURIComponent(id));
    let html='<div class="poet-hero-r">'+
      '<div class="hero-av" id="rhero">'+initial(poet.fullName)+'</div>'+
      '<h2 class="serif">'+esc(poet.fullName)+'</h2>'+
      '<div class="yrs">'+esc(poet.lifeYears||'')+'</div>';
    if(poet.bio) html+='<div class="bio-text" id="bioText">'+esc(poet.bio)+'</div>'+
      '<button class="bio-toggle" onclick="toggleBio()">doly oka ▾</button>';
    html+='</div>';
    html+='<div class="poems-list"><h3>Goşgular · '+curPoems.length+'</h3>';
    curPoems.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)).forEach((pm,i)=>{
      const liked=isLiked(pm.id);
      html+='<div class="poem-row" onclick="openPoem('+i+')">'+
        '<span class="num">'+(i+1)+'</span>'+
        '<span class="ptitle">'+esc(stripMk(pm.title))+'</span>'+
        '<span class="heart-sm'+(liked?' liked':'')+'">♥</span></div>';
    });
    if(!curPoems.length) html+='<div class="empty">Entek goşgy ýok</div>';
    html+='</div>';
    det.innerHTML=html;
    if(poet.imagePath) loadImg(poet.imagePath,'rhero');
  }catch(e){det.innerHTML='<div class="empty">Ýalňyşlyk: '+esc(e.message)+'</div>';}
}

function toggleBio(){
  const el=document.getElementById('bioText');
  if(el) el.classList.toggle('expanded');
}

// --- POEM READER ---
function openPoem(idx){
  curPoemIdx=idx; showScreen('Poem');
  renderPoem();
}

function renderPoem(){
  const pm=curPoems[curPoemIdx];
  if(!pm)return;
  const poet=poets.find(p=>p.id===curPoetId);
  const liked=isLiked(pm.id);
  let html='<div class="reader-wrap">'+
    '<div class="rtitle">'+esc(stripMk(pm.title))+'</div>'+
    '<div class="rauthor">'+esc(poet?poet.fullName:'')+'</div>';
  if(pm.epigraph) html+='<div class="repigraph">'+esc(pm.epigraph)+'</div>';
  html+='<div class="rtext">'+renderMarkup(pm.text)+'</div>';
  html+='<div class="like-bar">'+
    '<button class="like-btn'+(liked?' liked':'')+'" onclick="toggleLike(\''+pm.id+'\')">'+
      '<span class="icon">♥</span>'+(liked?'Halanylarym':'Halamak')+'</button>';
  // prev/next
  if(curPoemIdx>0) html+='<button class="like-btn" onclick="openPoem('+(curPoemIdx-1)+')"><span class="icon">‹</span>Öňki</button>';
  if(curPoemIdx<curPoems.length-1) html+='<button class="like-btn" onclick="openPoem('+(curPoemIdx+1)+')"><span class="icon">›</span>Indiki</button>';
  html+='</div></div>';
  document.getElementById('poemReader').innerHTML=html;
  window.scrollTo(0,0);
}

function toggleLike(poemId){
  setLike(poemId,!isLiked(poemId));
  renderPoem();
  // poet sanawyndaky ýürejigi-de täzeläýin (indiki gezek açylanda)
}

// --- Markup rendering ---
function stripMk(s){return(s||'').replace(/\*\*/g,'').replace(/\*/g,'').replace(/^>\s?/gm,'').replace(/^\*\*\*$/gm,'·');}

function renderMarkup(text){
  return (text||'').split('\n').map(line=>{
    if(line.trim()==='***') return '<span class="stanza-break"></span>';
    if(line.startsWith('> ')) return '<span class="quote">'+renderInline(line.slice(2))+'</span>';
    if(line.startsWith('>')) return '<span class="quote">'+renderInline(line.slice(1))+'</span>';
    return renderInline(line);
  }).join('\n');
}

function renderInline(s){
  // **bold** → <span class="bold">
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<span class="bold">$1</span>');
  s=s.replace(/\*(.+?)\*/g,'<span class="italic">$1</span>');
  return s;
}

init();
</script>
</body>
</html>
